<title>Sint Hubertus Bakkerij</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=DM+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
  /* Concept: affiche-bakkerij. Het hert van Sint Hubertus als merkteken, een gigantisch woord met brood als vulling, de toonbank als index en de bestelling als kassabon. Boskleur en korstoranje op meelwit; geen afgeronde kaartjes. */
  :root {
    --ink: #14110f;
    --flour: #f2f3ef;
    --forest: #1d392b;
    --crust: #d4561c;
    --line: #14110f;
    color-scheme: light;
  }
  html { scroll-behavior: smooth; }
  body { background: var(--flour); color: var(--ink); font-family: 'Source Serif 4', Georgia, serif; font-size: 18px; line-height: 1.6; overflow-x: clip; }
  .cond { font-family: 'Archivo', 'Arial Narrow', sans-serif; font-stretch: 62%; font-weight: 800; text-transform: uppercase; letter-spacing: -0.005em; }
  .wide { font-family: 'Archivo', Arial, sans-serif; font-stretch: 125%; font-weight: 900; text-transform: uppercase; letter-spacing: -0.04em; }
  .mono { font-family: 'DM Mono', ui-monospace, monospace; }
  h1, h2, h3 { text-wrap: balance; }
  section[id] { scroll-margin-top: 4.5rem; }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--crust); outline-offset: 3px; }

  .photo-text { background-size: cover; background-position: center 45%; -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .6rem; padding: .95rem 1.5rem; border: 2px solid var(--ink); font-family: 'DM Mono', monospace; font-size: .85rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; transition: transform .15s, box-shadow .15s, background .15s; }
  .btn-solid { background: var(--crust); color: #fff; box-shadow: 4px 4px 0 var(--ink); }
  .btn-solid:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
  .btn-solid:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .btn-line { background: transparent; color: var(--ink); }
  .btn-line:hover { background: var(--ink); color: var(--flour); }

  .marquee { display: flex; width: max-content; animation: scroll 38s linear infinite; }
  @keyframes scroll { to { transform: translateX(-50%); } }
  .spin { animation: spin 40s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* kassabon met getande onderrand */
  .bon { background: #fff; padding-bottom: 28px; -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 18px 100%; mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 18px 100%; }
  .bon-wrap { filter: drop-shadow(0 10px 18px rgba(20, 17, 15, .18)); }

  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .marquee, .spin { animation: none; } * { transition: none !important; } }
</style>

  /* ---------- Hulpfuncties ---------- */
  function computeStatus() {
    const parts = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Brussels", weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false }).formatToParts(new Date());
    const get = (t) => parts.find((x) => x.type === t).value;
    const map = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
    const day = map[get("weekday")];
    const time = (parseInt(get("hour"), 10) % 24) + parseInt(get("minute"), 10) / 60;
    const today = HOURS.find((x) => x.d === day);
    const isOpen = !!today.open && time >= today.open[0] && time < today.open[1];
    let text = "";
    if (isOpen) text = "Open tot " + fmt(today.open[1]);
    else for (let i = 0; i < 8; i++) {
      const d = (day + i) % 7, e = HOURS.find((x) => x.d === d);
      if (e.open && (i > 0 || time < e.open[0])) { text = "Opent " + (i === 0 ? "vandaag" : i === 1 ? "morgen" : dayName(d)) + " om " + fmt(e.open[0]); break; }
    }
    return { day, isOpen, text };
  }
  function useShopStatus() {
    const [s, setS] = useState(computeStatus);

    return s;
  }
  function useCopy() {
    const [done, setDone] = useState("");

    };
    return [done, copy];
  }
